name: Tests API (Newman)

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis à 6h UTC

jobs:
  tests-api:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Lancer les tests
        run: |
          mkdir -p reports
          newman run collections/restful-booker.postman_collection.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export reports/rapport.html \
            --reporter-htmlextra-title "Restful Booker - Tests API" \
            --reporter-junit-export reports/junit.xml

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-newman
          path: reports/
